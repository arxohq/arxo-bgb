[package]
name = "doctrine.ius_privatum"
version = "0.1.0"
language = "0.2"
namespace = "urn:doctrine:clir:ius-privatum"

# Каталожная метадата (DECISION-0051). Словарь без правопорядка: у него нет
# ни издателя, ни силы — только форма, в которую предметные кодексы частного
# права пишут свои материальные положения и свои средства защиты, чтобы один
# казус можно было провести через римское право, Меджелле, Code civil, BGB и
# ГК РК и спросить у каждого одно: «есть ли у притязания средство защиты».
# Титул без чисел меры §33.1: их дописывает композитор.
[metadata]
act = "doctrine-ius-privatum"
title = "Право и иск как одна конструкция: мостовой словарь ius privatum для сравнения кодексов"
primarySource = "IUS_PRIVATUM_MODEL"
jurisdiction = "none"
instrument = "doctrine"
sourceFidelity = "abstract_only"
# legalStatus: словарь не действует и не отменён — он не норма, а форма;
# ближайшее значение перечня — доктрина без силы.
legalStatus = "doctrine"
issuer = "law-dsl corpus (сравнительная цепь частного права, 02.09.2026)"
verifiedAgainstSource = false

# Рукописные сценарии пакета: исполняются общим раннером,
# в учёт покрытия регрессии не входят.
[[tests]]
family = "doctrine.ius_privatum#authored"
regression = false
suites = ["tests/ius-privatum-01-remedium-datur-ius-efficax.lawtest", "tests/ius-privatum-02-remedium-exclusum-ius-non-efficax.lawtest", "tests/ius-privatum-03-obligatio-sine-remedio-ius-nudum.lawtest", "tests/ius-privatum-04-remedium-sine-dominio.lawtest", "tests/ius-privatum-05-transit-ad-heredem.lawtest", "tests/ius-privatum-06-non-transit-ad-heredem.lawtest"]
world = ["doctrine.ius_privatum"]

# Сравнительные казусы цепи (раннер ius_privatum_casus): сторож молчания словаря.
# Объявлены здесь, чтобы вынос пакета не падал на «необъявленные тесты».
