# Familie „Querschnitt Widerruf/Fristen“ (Aufgabe §10 MULTISESSION-PROMPT,
# aufgeschoben von der Sitzung BG-04/BG-05): §§ 355, 356 Abs. 2–4 über
# de.bgb.fristen (§§ 187 Abs. 1, 188, 193) mit dem Verbraucherstatus über die
# Brücke §§ 13/14 (D-04-09/#bruecke-13-14) statt als lokaler Eingang. Beide
# Seiten der 14-Tage-Schwelle, Sonnabend- und Feiertagsverlegung, § 356
# Abs. 3 Satz 2 (Höchstfrist unabhängig von der Belehrung) auf beiden Seiten,
# die erklärte Grenze „Landesfeiertag wird von KALENDER_BUNDESWEIT nicht
# verlegt“, eine Unvollständigkeit (Verbraucherstatus ohne Urteil) und ein
# Kanarienvogel (ohne § 355 Abs. 1 Satz 1 kein Widerrufsrecht).
