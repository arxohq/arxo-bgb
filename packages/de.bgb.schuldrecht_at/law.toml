# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.schuldrecht_at"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-schuldrecht-at"

# Imports §23 (E-0122): the hub for persons, claims and obligations (BG-01),
# the owner of period computation (BG-02, DECISION-0319 Р4), and BG-03 for the
# bridge §§ 13, 14 (D-04-09) — the special periods of §§ 286 Abs. 3, 355, 356
# stay with their norms and read the mechanics there.
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"de.bgb.allgemeiner_teil" = "0.1.0"

[features]
enabled = ["law.params/0.1"]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-schuldrecht-at"
title = "Bürgerliches Gesetzbuch, Buch 2 Abschnitte 1–7: Inhalt der Schuldverhältnisse (§§ 241–304), Allgemeine Geschäftsbedingungen (§§ 305–310), Schuldverhältnisse aus Verträgen mit Verbraucherverträgen, digitalen Produkten, Rücktritt und Widerruf (§§ 311–361), Erlöschen (§§ 362–397), Übertragung einer Forderung und Schuldübernahme (§§ 398–419), Mehrheit von Schuldnern und Gläubigern (§§ 420–432)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

