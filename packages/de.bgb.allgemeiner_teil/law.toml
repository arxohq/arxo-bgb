# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.allgemeiner_teil"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-allgemeiner-teil"

# Imports §23 (E-0122): the hub for persons, things and animals; `de.bgb.fristen`
# for every period and every age (DECISION-0319 Р4: one owner of the computation
# of periods); `calc.kinship` for the parent edge § 11 needs.
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"calc.kinship" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-allgemeiner-teil"
title = "Bürgerliches Gesetzbuch, Buch 1: natürliche und juristische Personen, Sachen und Tiere, Rechtsgeschäfte (§§ 1–185), Ausübung der Rechte, Notwehr, Notstand, Selbsthilfe und Sicherheitsleistung (§§ 226–240a)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

# Scenarios of the package (DECISION-0127). Expectations are computed from the
# text by hand BEFORE execution; the world is the package, the hub, the period
# calculator and the kinship calculator.
[[tests]]
family = "de.bgb.allgemeiner_teil#personen"
regression = true
suites = [
  "tests/p01-volljaehrigkeit-am-achtzehnten-geburtstag.lawtest",
  "tests/p02-wohnsitz-des-minderjaehrigen-kindes.lawtest",
  "tests/p03-verbraucher-wartet-auf-das-gericht.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

[[tests]]
family = "de.bgb.allgemeiner_teil#positionen-145-175-226"
regression = true
suites = [
  "tests/positionen-145-175-226.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Rechtsgeschäfte: Geschäftsfähigkeit, Willenserklärung, Fristen der §§ 108, 124.
[[tests]]
family = "de.bgb.allgemeiner_teil#rechtsgeschaefte"
regression = true
suites = [
  "tests/r01-genehmigung-innerhalb-der-zwei-wochen.lawtest",
  "tests/r02-genehmigung-einen-tag-zu-spaet.lawtest",
  "tests/r03-taschengeldparagraph.lawtest",
  "tests/r04-anfechtung-binnen-jahresfrist.lawtest",
  "tests/r05-wucher-wartet-auf-zwei-urteile.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Sachen und Tiere: Zubehör und die Teilung der Früchte nach Tagen.
[[tests]]
family = "de.bgb.allgemeiner_teil#sachen"
regression = true
suites = [
  "tests/s01-anteiliger-ertrag-nach-tagen.lawtest",
  "tests/s02-zubehoer-des-landguts.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Vertretung: Vertreter ohne Vertretungsmacht und Insichgeschäft.
[[tests]]
family = "de.bgb.allgemeiner_teil#vertretung"
regression = true
suites = [
  "tests/v01-vertreter-ohne-vertretungsmacht.lawtest",
  "tests/v02-insichgeschaeft-ohne-gestattung.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Sicherheitsleistung: die Brüche der §§ 234, 237 in Geld.
[[tests]]
family = "de.bgb.allgemeiner_teil#sicherheitsleistung"
regression = true
suites = [
  "tests/si01-drei-viertel-des-kurswerts.lawtest",
  "tests/si02-zwei-drittel-des-schaetzungswerts.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Vereine: Mehrheiten der §§ 32, 33, Frist des § 73 und der Anfall des § 45.
[[tests]]
family = "de.bgb.allgemeiner_teil#vereine"
regression = true
suites = [
  "tests/ve01-mehrheit-der-abgegebenen-stimmen.lawtest",
  "tests/ve02-dreiviertelmehrheit-der-satzungsaenderung.lawtest",
  "tests/ve03-entziehung-nach-drei-monaten.lawtest",
  "tests/ve04-anfall-an-die-mitglieder-zu-gleichen-teilen.lawtest",
  "tests/ve05-ein-mitglied-weniger.lawtest",
]
world = ["de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]
