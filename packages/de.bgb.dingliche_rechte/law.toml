# Manifest §10 — root marker of the package (DECISION-0033). The §22 header of
# package.law is normative; the manifest must match it (LDC-E1109).
[package]
name = "de.bgb.dingliche_rechte"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-dingliche-rechte"

# Imports §23 (E-0122): the hub (persons, things, claim), the period mechanics
# of `de.bgb.fristen` — the sole owner of period computation in the family
# de.bgb.* (DECISION-0319, Р4) — and `de.bgb.besitz_eigentum`, which owns the
# land register, the rank of §§ 873, 879, 891, 892 and the ownership of
# §§ 903 ff. The encumbrances of this package are subtypes of its `Recht`
# (docs/foundations/de-bgb/DECISIONS.md, D-11-01).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"de.bgb.besitz_eigentum" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-dingliche-rechte"
title = "Bürgerliches Gesetzbuch, Buch 3 Abschnitte 4–8: Dienstbarkeiten (§§ 1018–1093), Vorkaufsrecht (§§ 1094–1104), Reallasten (§§ 1105–1112), Hypothek, Grundschuld, Rentenschuld (§§ 1113–1203) und Pfandrecht an beweglichen Sachen und an Rechten (§§ 1204–1296)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

