# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.bereicherung_delikt"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-bereicherung-delikt"

# Imports §23 (E-0122): the hub for persons, things, animals and the claim;
# de.bgb.fristen for the limitation of § 813 (§ 214 (2)) and § 852 sentence 2,
# and for the completed years of life of § 828 (§ 187 (2), § 188 (2)).
