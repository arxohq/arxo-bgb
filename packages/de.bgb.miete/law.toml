# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.miete"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-miete"

# Imports §23 (E-0122): the hub for persons and things; de.bgb.fristen for the
# calendar of § 193 (working days) used by the notice periods of §§ 573c, 584
# and 594a and by the declaration periods of §§ 545, 556 (3) and 558b (2).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-miete"
title = "Bürgerliches Gesetzbuch, Buch 2 Abschnitt 8 Titel 5: Mietvertrag, Pachtvertrag, Landpachtvertrag (§§ 535–597)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

# Untertitel 1: die Mängelkette der §§ 536–536d, der wichtige Grund des § 543
# und die beiden Fristen der §§ 545 und 548 — beide Seiten jeder Schwelle.
[[tests]]
family = "de.bgb.miete#maengel"
regression = true
suites = [
  "tests/a03-545-zwei-wochen-widerspruch-am-letzten-tag.lawtest",
]
world = ["de.bgb.miete", "de.bgb.fristen", "de.bgb.core"]

