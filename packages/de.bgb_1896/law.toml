# Manifest §10 — package-root marker (DECISION-0033). Normative headings §22
# live in the .law files; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "de.bgb_1896"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-1896"

[dependencies]
"doctrine.ius_privatum" = "0.1.0"

# Catalogue metadata (DECISION-0051). NOT semantics.
[metadata]
act = "de-bgb-1896"
title = "Bürgerliches Gesetzbuch of 18 August 1896, first edition: Anspruch and Verjährung, obligation, loan, deposit, delicts, possession and ownership, succession — slice for the comparative private-law chain"
primarySource = "BGB_1896"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
# legalStatus: monument — FIRST edition (DECISION-0091 fork 2); the living
# BGB is the same act in later texts; the revision axis to it is after F8.
legalStatus = "historical_monument"
issuer = "Reichstag und Bundesrath des Deutschen Reichs; verkündet vom Kaiser Wilhelm II."
verifiedAgainstSource = false

