# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.fristen"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-fristen"

# Imports §23 (E-0122): the hub for `Anspruch` (§ 194) and persons.
[dependencies]
"de.bgb.core" = "0.1.0"

[features]
semanticLayer = "L2"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-fristen"
title = "Bürgerliches Gesetzbuch, Buch 1 Abschnitte 4 und 5: Fristen und Termine (§§ 186–193) und Verjährung (§§ 194–218) — einziger Eigentümer der Fristenberechnung der Pakete de.bgb.* (DECISION-0319, Р4)"
