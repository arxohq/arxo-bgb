# Titel 1 und 2: Verlöbnis und Eingehung der Ehe. Die Erwartungen sind VOR der
# Ausführung aus dem Text gerechnet: die Vollendung des 16. Lebensjahrs am
# 09.05.2025 (§ 187 Abs. 2 Satz 2, § 188 Abs. 2) und das Ende der Zehnjahresfrist
# des § 1310 Abs. 3 am 14.04.2022 von Hand nachgezählt. `v02` ist der
# Kanarienvogel zum wichtigen Grund (§ 1298 Abs. 3), `v06` der Kanarienvogel
# „einen Tag später“ zur Altersschwelle des § 1303.
[[tests]]
family = "de.bgb.ehe#verloebnis-und-eingehung"
regression = true
suites = [
  "tests/v01-1298-ersatzpflicht-bei-ruecktritt.lawtest",
  "tests/v02-1298-abs3-wichtiger-grund-kanarienvogel.lawtest",
  "tests/v03-1301-satz2-vermutung-bei-tod.lawtest",
  "tests/v04-1302-verjaehrungsbeginn.lawtest",
  "tests/v05-1303-satz2-ehe-unter-sechzehn-unwirksam.lawtest",
  "tests/v06-1303-kanarienvogel-einen-tag-spaeter.lawtest",
  "tests/v07-1307-geschwister-eheverbot.lawtest",
  "tests/v08-1310-abs3-heilung-nach-zehn-jahren.lawtest",
]
world = ["de.bgb.ehe", "de.bgb.fristen", "de.bgb.core", "calc.kinship"]

# Titel 3: Aufhebung. `a03` und `a04` sind das Paar am letzten Tag der
