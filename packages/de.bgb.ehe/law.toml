# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.ehe"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-ehe"

# Imports §23 (E-0122): the hub for persons and courts; de.bgb.fristen for the
# periods of §§ 1310, 1315, 1317, 1320, 1366, 1375, 1385, 1565, 1566, 1568a,
# 1570, 1585b and for the completed years of life of § 1303 (§ 187 (2),
# § 188 (2)); calc.kinship for the impediment of kinship (§ 1307).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"calc.kinship" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-ehe"
title = "Bürgerliches Gesetzbuch, Buch 4 Abschnitt 1: Verlöbnis, Eingehung der Ehe, Aufhebung, Wirkungen der Ehe, eheliches Güterrecht (Zugewinngemeinschaft §§ 1363–1390, vertragliches Güterrecht, Gütergemeinschaft §§ 1415–1518), Scheidung, nachehelicher Unterhalt, kirchliche Verpflichtungen (§§ 1297–1588)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

