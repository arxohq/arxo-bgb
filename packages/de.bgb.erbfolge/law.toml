# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.erbfolge"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-erbfolge"

# Imports §23 (E-0122): persons of the hub, the property regime and § 1371
# Abs. 1 from `de.bgb.ehe` (direction erbfolge → ehe, DECISION-0319), the
# family graph from the shared calculator `calc.kinship` (P28, DECISION-0217).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.ehe" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"calc.kinship" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-erbfolge"
title = "Bürgerliches Gesetzbuch, Buch 5 Abschnitte 1–2: gesetzliche Erbfolge (Parentelsystem §§ 1924–1930, Erbfolge nach Stämmen, Ehegatte § 1931 mit § 1371 Abs. 1), rechtliche Stellung des Erben (§§ 1922–2063) — Pilot B1: Ordnungen 1–3, Stämme, Ehegatte, exakte Brüche"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

# Pilot B1 (task section 8): vertical pilot of intestate succession.
# Expectations computed by hand from the text BEFORE execution and checked
# against the official BMJ brochure „Erben und Vererben“ where it gives the
# case (sources/bmj-erben-und-vererben). World: the hub, the matrimonial
# package and the kinship calculator.
[[tests]]
family = "de.bgb.erbfolge#erbfolge-pilot"
regression = true
suites = [
  "tests/e01-ehegatte-und-zwei-kinder-zugewinn.lawtest",
  "tests/e02-stamm-des-vorverstorbenen-kindes.lawtest",
  "tests/e03-guetertrennung-zwei-kinder-1931-abs4.lawtest",
  "tests/e04-eltern-und-ehegatte-zugewinn.lawtest",
  "tests/e05-zweite-ordnung-stamm-der-verstorbenen-mutter.lawtest",
  "tests/e06-zweite-ordnung-ueberlebender-elternteil-allein.lawtest",
  "tests/e07-dritte-ordnung-linien-und-anwachsung.lawtest",
  "tests/e08-kanarienvogel-ohne-zweiten-enkel.lawtest",
  "tests/e09-ehegatte-allein-neben-vetter.lawtest",
  "tests/e10-summe-der-erbteile.lawtest",
]
world = ["de.bgb.erbfolge", "de.bgb.ehe", "de.bgb.core", "calc.kinship"]

