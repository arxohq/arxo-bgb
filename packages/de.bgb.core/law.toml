# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.core"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-core"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
# The hub pins no norm of its own: the paragraphs live in the subject packages
# de.bgb.* (docs/foundations/de-bgb/PACKAGES.json), hence sourceFidelity abstract_only.
[metadata]
act = "de-bgb-core"
title = "Bürgerliches Gesetzbuch — Nabe der Pakete de.bgb.*: Personen (natürliche und juristische), Sachen und Tiere, Anspruch als eigener Träger, Schuldverhältnis, Gerichte und Behörden, Vertrag der Urteilsanfrage (DECISION-0194)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "abstract_only"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

# Hub without norms: one empirical case so the spin-off proves the shared
# Anspruch-Träger of § 194 (1) is loadable (BGD-0.5).
[[tests]]
family = "de.bgb.core#nabe"
regression = true
suites = [
  "tests/nabe-anspruch.lawtest",
]
world = ["de.bgb.core"]
