# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.uebergang"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-uebergang"

# Imports §23 (E-0122): the hub (Anspruch, its accrual day) and the
# limitation mechanics of `de.bgb.fristen` (regular period, Ultimo).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
# The units of this package are paragraphs of the EGBGB (Art. 229), pinned
# from the bgbeg snapshot of gesetze-im-internet.de (DOKNR-bgbeg.json).
[metadata]
act = "de-bgb-uebergang"
title = "Einführungsgesetz zum BGB, Art. 229: Überleitungsvorschriften der Reformen des BGB — § 5 (Schuldrechtsmodernisierung 2002, allgemein), § 6 (Verjährung 2002), § 23 (Erb- und Verjährungsrecht 2010); Anknüpfungsmomente und Korridore für die Pakete de.bgb.*"
primarySource = "EGBGB"
jurisdiction = "DE"
instrument = "statute"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 21. September 1994, BGBl. I S. 2494; 1997 S. 1061)"
verifiedAgainstSource = false

# Wave B2: the 2002 limitation corridor (Art. 229 § 6 Abs. 1, 3, 4) as rules
# over dates; expectations computed by hand from the text before execution.
[[tests]]
family = "de.bgb.uebergang#verjaehrung-2002"
regression = true
suites = [
  "tests/u01-alte-frist-laenger-neue-ab-stichtag.lawtest",
  "tests/u02-alte-frist-laeuft-frueher-ab.lawtest",
  "tests/u03-anspruch-nach-stichtag-kein-korridor.lawtest",
  "tests/u04-neue-frist-laenger-alte-massgeblich.lawtest",
]
world = ["de.bgb.uebergang", "de.bgb.fristen", "de.bgb.core"]

# Welle B2 (V2-BG-17-01, Koordinator 18.09): Art. 229 § 6 Abs. 1 S. 2
# (Hemmung vor 2002), Abs. 2 (Unterbrechung -> Hemmung), Abs. 4
# (BGH-Lesart §152 any_of); § 5 (allgemeine Überleitung); § 23
# (Erb- und Verjährungsrecht 2010).
[[tests]]
family = "de.bgb.uebergang#hemmung-kenntnis-para5-para23"
regression = true
suites = [
  "tests/v01-alte-hemmung-vor-2002.lawtest",
  "tests/v02-unterbrechung-wird-hemmung-ab-2002.lawtest",
  "tests/v03-bgh-lesart-kenntnis-nach-stichtag.lawtest",
  "tests/v04-para5-einmaliges-schuldverhaeltnis.lawtest",
  "tests/v05-para5-dauerschuldverhaeltnis-vor-2003.lawtest",
  "tests/v06-para5-dauerschuldverhaeltnis-ab-2003.lawtest",
  "tests/v07-para23-altes-recht-frueher.lawtest",
  "tests/v08-para23-erbfall-vor-2010.lawtest",
  "tests/v09-para23-erbfall-ab-2010.lawtest",
]
world = ["de.bgb.uebergang", "de.bgb.fristen", "de.bgb.core"]

# Sequenz 2 (Koordinator 18.09): Entstehung -> Kenntnis (adjudicated) ->
# Ultimo -> überschneidende Hemmung -> Höchstfrist (die frühere von beiden
# maßgeblich) -> Korridor 2002. Neubeginn (§ 212) bereits einzeln in
# de.bgb.fristen#neubeginn-212-213 geprüft, hier aus Konfliktgründen
# (verjaehrung_massgeblich_am ersetzt die reguläre Kette vollständig)
# nicht auf demselben Anspruch verkettet.
[[tests]]
family = "de.bgb.uebergang#verjaehrung-querschnitt"
regression = true
suites = [
  "tests/w01-querschnitt-entstehung-kenntnis-hemmung-hoechstfrist.lawtest",
  "tests/w02-querschnitt-korridor-2002.lawtest",
]
world = ["de.bgb.uebergang", "de.bgb.fristen", "de.bgb.core"]
