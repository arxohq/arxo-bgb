# Familie „Querschnitt Kauf/Rücktritt/Verjährung“ (Aufgabe §10 MULTISESSION-
# PROMPT, aufgeschoben von der Sitzung BG-04/BG-05, D-05-10): §§ 437 Nr. 2,
# 323 (de.bgb.schuldrecht_at) additiv zum abstrakten § 437-Kopf, § 218
# (de.bgb.fristen, nicht BG-04 — gemessen bei der Vorbereitung) additiv zum
# lokalen Eingang `ruecktritt_nach_218_unwirksam`, § 438 Abs. 3 Arglist als
# einziger derzeit verdrahteter Pfad zur generischen Verjährung, die § 218
# liest (Grenze: die gewöhnlichen 2/5/30-Jahres-Fristen des § 438 speisen
# de.bgb.fristen::verjaehrung_eingetreten_am NICHT — D-05-11), Korridor 2022
# im selben Fall wie das Rücktrittsrecht, eine Unvollständigkeit und ein
# Kanarienvogel.
[[tests]]
family = "de.bgb.kauf#querschnitt-kauf-ruecktritt-verjaehrung"
regression = true
suites = [
  "tests/kq01-mangel-frist-erfolglos-ruecktrittsrecht.lawtest",
  "tests/kq02-arglist-verjaehrung-ohne-berufung.lawtest",
  "tests/kq03-arglist-verjaehrung-mit-berufung.lawtest",
  "tests/kq04-korridor-2022-mit-ruecktrittsrecht.lawtest",
  "tests/kq05-unvollstaendigkeit-angemessenheit-offen.lawtest",
  "tests/kq06-kanarie-ohne-frist-erfolglos.lawtest",
  "tests/kq07-regelfrist-zwei-jahre-ruecktritt-zu-spaet.lawtest",
  "tests/kq08-regelfrist-zwei-jahre-ruecktritt-rechtzeitig.lawtest",
  "tests/kq09-regelfrist-mit-hemmung-verschiebt-verjaehrung.lawtest",
]
world = ["de.bgb.kauf", "de.bgb.schuldrecht_at", "de.bgb.allgemeiner_teil", "de.bgb.fristen", "de.bgb.core"]

