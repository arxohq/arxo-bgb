# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.kauf"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-kauf"

# Imports §23 (E-0122): the hub for persons, things, animals and the claim;
# de.bgb.fristen for the regular limitation period of § 438 (3) (§§ 195, 199);
# de.bgb.allgemeiner_teil for the bridge § 474 (D-05-08); de.bgb.schuldrecht_at
# for the bridge §§ 323, 218 (D-05-10) — Rücktritt/Schadensersatz stay BG-04's
# own norms (D-05-02), this package only reads their heads additively.
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"de.bgb.allgemeiner_teil" = "0.1.0"
"de.bgb.schuldrecht_at" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-kauf"
title = "Bürgerliches Gesetzbuch, Buch 2 Abschnitt 8 Titel 1: Kauf, Tausch (§§ 433–480)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

# § 434 und § 435: die drei Anforderungsgruppen, der geschlossene Katalog des
# § 437 und die Sperren der §§ 442, 444, 445. Erwartungen sind vor der
# Ausführung aus dem Text gerechnet.
[[tests]]
family = "de.bgb.kauf#sachmangel"
regression = true
suites = [
  "tests/s01-434-abs3-nr1-gewoehnliche-verwendung.lawtest",
  "tests/s02-434-abs1-alle-anforderungen-erfuellt.lawtest",
  "tests/s03-434-abs5-aliud.lawtest",
  "tests/s04-434-abs3-nr2-ohne-antwort-des-gerichts.lawtest",
  "tests/s05-434-abs4-nr2-unsachgemaesse-montage-ohne-zurechnung.lawtest",
  "tests/s06-442-abs1-satz1-kenntnis-sperrt-die-rechte.lawtest",
  "tests/s07-435-rechtsmangel-und-444-arglist.lawtest",
  "tests/s08-434-abs3-kanarienvogel-ohne-die-angabe-der-vereinbarung.lawtest",
]
world = ["de.bgb.kauf", "de.bgb.fristen", "de.bgb.core"]

# § 438 (zwei, fünf, dreißig Jahre; Ablieferung und Übergabe; Arglist mit dem
# Vorrang der fünfjährigen Frist) und § 445b (Ablaufhemmung). Die Mechanik der
# regelmäßigen Frist rechnet de.bgb.fristen (§§ 195, 199 Abs. 1).
[[tests]]
family = "de.bgb.kauf#verjaehrung-438"
regression = true
suites = [
  "tests/v01-438-abs1-nr3-zwei-jahre-ab-ablieferung.lawtest",
  "tests/v02-438-abs1-nr2-fuenf-jahre-bauwerk.lawtest",
  "tests/v03-438-abs1-nr1-dreissig-jahre-und-uebergabe.lawtest",
  "tests/v04-438-abs3-arglist-regelmaessige-frist.lawtest",
  "tests/v05-438-abs3-satz2-fuenf-jahre-gehen-vor.lawtest",
  "tests/v06-445b-abs2-ablaufhemmung-zwei-monate.lawtest",
]
world = ["de.bgb.kauf", "de.bgb.fristen", "de.bgb.core"]

# § 441 Abs. 3 und 4: die einzige Division des Untertitels 1, ein nicht
