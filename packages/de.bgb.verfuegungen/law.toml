# Manifest §10 — root marker of the package (DECISION-0033). The §22 headers of
# the .law files are normative; the manifest must match them (LDC-E1109).
[package]
name = "de.bgb.verfuegungen"
version = "0.1.0"
language = "0.2"
namespace = "urn:de:corpus:clir:bgb-verfuegungen"

# Imports §23 (E-0122): the hub, the statutory share from `de.bgb.erbfolge`
# (the compulsory portion is half of its VALUE, § 2303), the matrimonial
# package and the kinship calculator — the scenarios of this package state
# the marriage and the family graph with qualified names, so both are
# imported by the package itself (LDC-E1105 otherwise).
[dependencies]
"de.bgb.core" = "0.1.0"
"de.bgb.ehe" = "0.1.0"
"de.bgb.erbfolge" = "0.1.0"
"de.bgb.fristen" = "0.1.0"
"calc.kinship" = "0.1.0"

[features]
semanticLayer = "L1"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). Not semantics.
[metadata]
act = "de-bgb-verfuegungen"
title = "Bürgerliches Gesetzbuch, Buch 5 Abschnitte 3–9: Testament, Erbvertrag, Pflichtteil (§§ 2303–2338), Erbunwürdigkeit, Erbverzicht, Erbschein, Erbschaftskauf (§§ 2064–2385) — Pilot B1: Pflichtteil als Geldanspruch (§ 2303, § 2311) und Pflichtteilsergänzung mit Abschmelzung (§ 2325 Abs. 3)"
primarySource = "BGB"
jurisdiction = "DE"
instrument = "code"
sourceFidelity = "pinned_unofficial_copy"
legalStatus = "in_force"
issuer = "Deutscher Bundestag; verkündet im Bundesgesetzblatt Teil I (Neufassung vom 2. Januar 2002, BGBl. I S. 42, 2909; 2003 S. 738)"
verifiedAgainstSource = false

[[tests]]
family = "de.bgb.verfuegungen#positionen-2158-2162"
regression = true
suites = [
  "tests/positionen-2158-2162.lawtest",
]
world = ["de.bgb.verfuegungen", "de.bgb.erbfolge", "de.bgb.ehe", "de.bgb.core", "de.bgb.fristen", "calc.kinship"]

